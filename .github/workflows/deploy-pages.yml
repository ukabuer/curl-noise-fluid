name: Deploy to GitHub Pages

# Publishes dist/ with the official Pages actions — no gh-pages branch involved.
# One-time repo setup: Settings -> Pages -> Source must be "GitHub Actions".

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Least privilege for a Pages deployment: read the repo, hand the artifact to
# the Pages service and mint the OIDC token it verifies.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel a running production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
